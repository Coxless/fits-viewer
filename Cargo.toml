[workspace]
members = [
    "crates/fitsview-core",
    "crates/fitsview-gui",
    "crates/fitsview-cli",
    # fitsview-wasm: build with `trunk build` from crates/fitsview-wasm/
    # (excluded from default workspace; target = wasm32)
    # fitsview-py: build with `maturin develop` from crates/fitsview-py/
    # (excluded from default workspace; requires Python environment)
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
