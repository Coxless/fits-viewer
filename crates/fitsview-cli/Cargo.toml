[package]
name = "fitsview-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fits-view"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = ["fitsview-gui/gpu"]
cpu-only = ["fitsview-gui/cpu-only"]

[dependencies]
fitsview-core = { path = "../fitsview-core" }
fitsview-gui = { path = "../fitsview-gui", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = { workspace = true }
rayon = "1"
