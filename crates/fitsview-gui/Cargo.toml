[package]
name = "fitsview-gui"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu"]
gpu = ["dep:wgpu"]
cpu-only = []

[dependencies]
fitsview-core = { path = "../fitsview-core" }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
wgpu = { version = "23", optional = true }
notify = "7"
anyhow = { workspace = true }
log = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
