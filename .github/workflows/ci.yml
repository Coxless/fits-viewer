name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: sudo apt-get install -y pkg-config libssl-dev
      - name: Clippy (cpu-only)
        run: cargo clippy --workspace --no-default-features --features cpu-only -- -D warnings
      - name: Test (cpu-only)
        run: cargo test --workspace --no-default-features --features cpu-only
